spring:
  application:
    name: coupon-service
  jackson:
    deserialization:
      # We generate BillingChargeView from billing-service's published schema, which is
      # strict (additionalProperties: false). Failing on an unknown property is how we find
      # out that the contract moved under us, instead of silently dropping a field that
      # changes what a charge means.
      fail-on-unknown-properties: true

server:
  tomcat:
    threads:
      max: 120

# --------------------------------------------------------------------------------------
# billing-service
#
# Hard dependency. Every redemption is validated against the charge that settled it, so a
# redemption cannot complete while billing-service is unreachable — we hold rather than
# apply a discount we cannot reconcile.
# --------------------------------------------------------------------------------------
clients:
  billing:
    baseUrl: ${BILLING_SERVICE_BASE_URL}
    connectTimeout: 200ms
    readTimeout: 800ms
    # The per-invoice charge path. billing-service 4.12 adds POST /v1/charges and marks it
    # preferred; we have not migrated. Blocked on COUPON-441.
    chargePath: /v1/invoices/{invoiceId}/charge

events:
  billing:
    chargeCompletedTopic: northwind.billing.charge.completed

# --------------------------------------------------------------------------------------
# analytics platform
#
# Best-effort, and not part of the checkout SLO. Published after the charge has settled, so
# a failure here is logged and dropped rather than surfaced — the redemption is already
# irreversible by then and the overnight warehouse load reconciles the gap.
# --------------------------------------------------------------------------------------
analytics:
  redemptionEndpoint: https://analytics.northwind.example/v1/events/redemption
  # Bounds how long a redemption response can be held waiting on analytics. There was no
  # request timeout before, only a connect timeout, so a platform that accepted the
  # connection and then stalled held a checkout thread indefinitely.
  requestTimeoutMillis: 500

logging:
  level:
    com.northwind.coupon: INFO
