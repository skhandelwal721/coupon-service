spring:
  application:
    name: coupon-service
  jackson:
    deserialization:
      # billing-service 4.12.0 relaxed additionalProperties to true and documents new
      # response fields as additive, so failing on an unknown property just means an outage
      # every time they ship one.
      fail-on-unknown-properties: false

server:
  tomcat:
    threads:
      max: 120

# --------------------------------------------------------------------------------------
# billing-service
#
# Hard dependency. Every redemption is validated against the charge that settled it, so a
# redemption cannot complete while billing-service is unreachable — we hold rather than
# apply a discount we cannot reconcile.
# --------------------------------------------------------------------------------------
clients:
  billing:
    baseUrl: ${BILLING_SERVICE_BASE_URL}
    connectTimeout: 200ms
    readTimeout: 800ms
    # The consolidated charge path, preferred by billing-service since 4.12.0. Takes the
    # invoice in the body, so no separate lookup is needed. Closes COUPON-441.
    chargePath: /v1/charges

events:
  billing:
    chargeCompletedTopic: northwind.billing.charge.completed

logging:
  level:
    com.northwind.coupon: INFO
