spring:
  application:
    name: coupon-service
  jackson:
    deserialization:
      # We generate BillingChargeView from billing-service's published schema, which is
      # strict (additionalProperties: false). Failing on an unknown property is how we find
      # out that the contract moved under us, instead of silently dropping a field that
      # changes what a charge means.
      fail-on-unknown-properties: true

server:
  tomcat:
    threads:
      max: 120

# --------------------------------------------------------------------------------------
# billing-service
#
# Hard dependency. Every redemption is validated against the charge that settled it, so a
# redemption cannot complete while billing-service is unreachable — we hold rather than
# apply a discount we cannot reconcile.
# --------------------------------------------------------------------------------------
# --------------------------------------------------------------------------------------
# Shared Redis cluster — velocity counters (ECS-2.2)
#
# Failure here fails redemption closed. That is deliberate: a velocity check that passes
# because its store is unavailable is worse than no check, because nothing says so.
# --------------------------------------------------------------------------------------
spring.data.redis:
  url: ${REDIS_URL}
  timeout: 200ms
  connect-timeout: 200ms

clients:
  billing:
    baseUrl: ${BILLING_SERVICE_BASE_URL}
    connectTimeout: 200ms
    readTimeout: 800ms
    # The per-invoice charge path. billing-service 4.12 adds POST /v1/charges and marks it
    # preferred; we have not migrated. Blocked on COUPON-441.
    chargePath: /v1/invoices/{invoiceId}/charge

events:
  billing:
    chargeCompletedTopic: northwind.billing.charge.completed

# --------------------------------------------------------------------------------------
# SEPA / EUR settlement — COUPON-490
#
# The euro catalogue settles through SEPA rather than Bacs/FPS. Amounts on the receipt and on
# the settlement instruction are carried in minor units, which is what ISO 20022 InstdAmt
# expects, and the structured address element is restricted to alphanumerics by the scheme
# implementation guidelines.
# --------------------------------------------------------------------------------------
settlement:
  sepa:
    enabled: true
    currencies: GBP,EUR
    amountRepresentation: MINOR_UNITS
    structuredAddress: true

analytics:
  redemptionEndpoint: https://analytics.northwind.example/v1/events/redemption
  # Both timeouts are required (ECS-4.4). A connect timeout alone let a platform that accepted
  # the connection and then stalled hold a checkout thread indefinitely.
  connectTimeoutMillis: 500
  requestTimeoutMillis: 500

# --------------------------------------------------------------------------------------
# Fraud velocity — COUPON-491
#
# Two counters: per device+origin+card against one promotion, and per device+origin across the
# whole catalogue. Limits are configurable so financial crime can tune them without a deploy.
# --------------------------------------------------------------------------------------
fraud:
  velocity:
    # Where counters live. `redis` is the default and the only production value — ECS-2.2
    # requires rate-limiting state in the shared cluster. `memory` exists for local development
    # and is a per-instance counter, which is an n-times-the-limit bypass in production.
    store: redis
    maxPerCoupon: 3
    maxPerDevice: 40
    # An attempt carrying no device or origin cannot be checked against the catalogue-sweep
    # pattern, so it is held to a tighter limit rather than waved through. Omitting the fields
    # tightens the check; there is nothing to gain by leaving them out.
    maxUnattributed: 2
    # Counter keys are keyed HMAC-SHA256 digests of the device, origin and card (DPP-11). The
    # secret comes from the platform secret store; the service refuses to start without it
    # rather than degrading to keying on raw values. Minimum 32 bytes, enforced at startup.
    hashKey: ${FRAUD_VELOCITY_HASH_KEY}
    # Set for one counter window during a key rotation, then removed. While it is set the guard
    # takes the higher of the counts under both keys, so a rotation is not a way for an attacker
    # at their limit to get a clean slate. See DPP-11.
    previousHashKey: ${FRAUD_VELOCITY_PREVIOUS_HASH_KEY:}
    # Retention. Counters expire after this window, which is both the fraud lookback and the
    # retention period for the pseudonymised keys (DPP-5.1).
    windowMinutes: 1440
    # Hard ceiling, for the local-development in-memory store only. Redis expires keys on their
    # own TTL and the cluster is sized independently, so there is nothing to bound in-process.
    maxTrackedKeys: 250000

logging:
  level:
    com.northwind.coupon: INFO
    # No package override. COUPON-491 set this to DEBUG in production while the fraud package
    # was emitting cardholder data and personal data, which DPP-3.4 does not permit at any
    # level. The attempt context financial crime asked for is now available without it: every
    # check logs a non-reversible deviceRef at INFO.
