spring:
  application:
    name: coupon-service
  jackson:
    deserialization:
      # We generate BillingChargeView from billing-service's published schema, which is
      # strict (additionalProperties: false). Failing on an unknown property is how we find
      # out that the contract moved under us, instead of silently dropping a field that
      # changes what a charge means.
      fail-on-unknown-properties: true

server:
  tomcat:
    threads:
      max: 120

# --------------------------------------------------------------------------------------
# billing-service
#
# Hard dependency. Every redemption is validated against the charge that settled it, so a
# redemption cannot complete while billing-service is unreachable — we hold rather than
# apply a discount we cannot reconcile.
# --------------------------------------------------------------------------------------
clients:
  billing:
    baseUrl: ${BILLING_SERVICE_BASE_URL}
    connectTimeout: 200ms
    readTimeout: 800ms
    # The per-invoice charge path. billing-service 4.12 adds POST /v1/charges and marks it
    # preferred; we have not migrated. Blocked on COUPON-441.
    chargePath: /v1/invoices/{invoiceId}/charge

events:
  billing:
    chargeCompletedTopic: beaconstone.billing.charge.completed

# --------------------------------------------------------------------------------------
# SEPA / EUR settlement — COUPON-490
#
# The euro catalogue settles through SEPA rather than Bacs/FPS. Amounts on the receipt and on
# the settlement instruction are carried in minor units, which is what ISO 20022 InstdAmt
# expects, and the structured address element is restricted to alphanumerics by the scheme
# implementation guidelines.
# --------------------------------------------------------------------------------------
settlement:
  sepa:
    enabled: true
    currencies: GBP,EUR
    amountRepresentation: MINOR_UNITS
    structuredAddress: true

# --------------------------------------------------------------------------------------
# Promotions launch flags — COUPON-573
#
# nlLaunch gates the Netherlands-only BS-NL-20 coupon. The catalogue registers the code only
# when this is true (see CouponRepository), so when it is false the code cannot be resolved,
# redeemed, or charged against — it does not exist.
#
# This default is false. It is set to true in the PRODUCTION deploy only: the change to enable
# BS-NL-20 for Netherlands customers is a production-only change, and lower environments keep
# the coupon off. Flip this back to false to withdraw the coupon without a code revert — see
# docs/runbooks/redemption.md, "Netherlands launch (BS-NL-20)".
# --------------------------------------------------------------------------------------
promotions:
  nlLaunch:
    enabled: true
  # COUPON-610: euPercentage gates BS-EUP-20, the first percentage discount in the catalogue
  # (20% off, EU-wide, EUR). The catalogue registers the code only when this is true; when false
  # it cannot be resolved or redeemed. Default false; set true in the PRODUCTION deploy only.
  euPercentage:
    enabled: true

analytics:
  redemptionEndpoint: https://analytics.beaconstone.example/v1/events/redemption

# --------------------------------------------------------------------------------------
# Fraud velocity — COUPON-491
#
# Two counters: per device+origin+card against one promotion, and per device+origin across the
# whole catalogue. Limits are configurable so financial crime can tune them without a deploy.
# --------------------------------------------------------------------------------------
fraud:
  velocity:
    maxPerCoupon: 3
    maxPerDevice: 40

logging:
  level:
    com.beaconstone.coupon: INFO
    # Financial crime asked for the full attempt context while the new counters bed in.
    com.beaconstone.coupon.fraud: DEBUG

# --------------------------------------------------------------------------------------
# AMEX as a European payment option — PAY-8100
#
# Introduces AMEX as a payment option for customers in Europe. When enabled, AMEX is offered
# only for the European billing countries listed in AmexEuropeEligibility; a request from
# outside that set is turned away before any charge. Default is false; set true in the
# Production deploy to make the option live.
# --------------------------------------------------------------------------------------
payments:
  amexEurope:
    enabled: true
