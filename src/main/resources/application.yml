spring:
  application:
    name: coupon-service
  jackson:
    deserialization:
      # The regional charge endpoints annotate their responses with the zone the charge was
      # taken in, and that annotation lands per region as each one is certified. Failing on it
      # would mean a storefront outage in that region, on certification day, for a field we do
      # not read.
      fail-on-unknown-properties: false

server:
  tomcat:
    threads:
      max: 120

# --------------------------------------------------------------------------------------
# billing-service
#
# Hard dependency. Every redemption is validated against the charge that settled it, so a
# redemption cannot complete while billing-service is unreachable — we hold rather than
# apply a discount we cannot reconcile.
# --------------------------------------------------------------------------------------
clients:
  billing:
    baseUrl: ${BILLING_SERVICE_BASE_URL}
    connectTimeout: 200ms
    readTimeout: 800ms
    # The per-invoice charge path. billing-service 4.12 adds POST /v1/charges and marks it
    # preferred; we have not migrated. Blocked on COUPON-441.
    chargePath: /v1/invoices/{invoiceId}/charge

events:
  billing:
    chargeCompletedTopic: northwind.billing.charge.completed

# --------------------------------------------------------------------------------------
# EU data residency — COUPON-493
#
# Personal data of EU data subjects is processed inside the EU Data Boundary. EUR settles in
# Frankfurt, GBP in London under the UK adequacy decision. Outbound identifiers are qualified
# with the zone so a residency decision is auditable per record.
# --------------------------------------------------------------------------------------
residency:
  enabled: true
  defaultZone: eu-central-1
  approvedZones: eu-central-1,eu-west-1,eu-west-2
  tagOutboundReferences: true

analytics:
  # Regional endpoint, so redemption telemetry stays inside the boundary.
  redemptionEndpoint: https://analytics.eu-central-1.northwind.example/v1/events/redemption

logging:
  level:
    com.northwind.coupon: INFO
